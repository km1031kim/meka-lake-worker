plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.osdetector' version '1.7.3'

}
configurations.configureEach {
	exclude group: 'org.slf4j', module: 'slf4j-reload4j'
}
group = 'com.metalake'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	icebergVersion = '1.10.0'
	parquetVersion = '1.16.0'
	awsSdkVersion = '2.33.0'
}



configurations.named('testRuntimeClasspath') {
	exclude group: 'org.slf4j', module: 'slf4j-reload4j'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // QueryDSL (OpenFeign 7.7)
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.7'

    // QueryDSL Annotation Processor
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.7:jpa'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation platform('software.amazon.awssdk:bom:2.57.3')

	implementation 'org.apache.opendal:opendal:0.50.8'
	runtimeOnly "org.apache.opendal:opendal:0.50.8:${osdetector.classifier}"

	implementation 'org.apache.hadoop:hadoop-common:3.3.4'
	implementation 'org.apache.hadoop:hadoop-mapreduce-client-core:3.3.4'

	testRuntimeOnly 'org.apache.gravitino:gravitino-filesystem-hadoop3-runtime:1.3.0'

	// Hadoop S3A 지원
	testRuntimeOnly 'org.apache.hadoop:hadoop-aws:3.3.4'
	testRuntimeOnly 'com.amazonaws:aws-java-sdk-bundle:1.12.262'

	implementation 'org.apache.tika:tika-core:3.2.3'

	// Iceberg
	implementation "org.apache.iceberg:iceberg-core:${icebergVersion}"
	implementation "org.apache.iceberg:iceberg-data:${icebergVersion}"
	implementation "org.apache.iceberg:iceberg-parquet:${icebergVersion}"
	implementation "org.apache.iceberg:iceberg-aws:${icebergVersion}"

	implementation "org.apache.parquet:parquet-column:${parquetVersion}"


	// AWS SDK 버전 통일
	implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")

	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:kms'
	implementation 'software.amazon.awssdk:sts'
	implementation 'software.amazon.awssdk:apache-client'
}

tasks.named('test') {
	useJUnitPlatform()
}
